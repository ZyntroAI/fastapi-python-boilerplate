apiVersion: v1
kind: ServiceAccount
metadata:
  name: zyntro-gateway-vault
  namespace: zyntroai
  annotations:
    vault.hashicorp.com/role: "zyntro-gateway"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zyntro-gateway
  namespace: zyntroai
  annotations:
    vault.hashicorp.com/agent-inject: "true"
    vault.hashicorp.com/agent-inject-status: "true"
    vault.hashicorp.com/role: "zyntro-gateway"
    vault.hashicorp.com/agent-pre-populate-only: "true"
spec:
  template:
    spec:
      serviceAccountName: zyntro-gateway-vault
      containers:
        - name: gateway
          env:
            # NO hardcoded secrets — all injected at runtime
            - name: VAULT_ADDR
              value: "https://vault.vault.svc:8200"
