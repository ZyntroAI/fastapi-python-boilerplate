# Secrets — apply from a sealed/encrypted source, never commit real values.
# Reference: kubectl create secret generic zyntroai-secrets \
#   --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#   --from-literal=REDIS_URL='redis://...' \
#   --from-literal=JWT_SECRET='...' \
#   --from-literal=ALGOLIA_APP_ID='...' \
#   --from-literal=ALGOLIA_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: zyntroai-secrets
type: Opaque
stringData:
  DATABASE_URL: "postgresql+asyncpg://user:pass@postgres:5432/zyntro"
  REDIS_URL: "redis://redis:6379/0"
  JWT_SECRET: "REPLACE_ME"
  ALGOLIA_APP_ID: ""
  ALGOLIA_API_KEY: ""
