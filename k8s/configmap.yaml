apiVersion: v1
kind: ConfigMap
metadata:
  name: oauth-config
  namespace: oauth
data:
  BASE_URL: "https://oauth.example.com"
  OAUTH_PROVIDER: "google"
  OAUTH_SCOPES: "openid email profile"
  JWT_ALG: "HS256"
  JWT_TTL_SECONDS: "3600"
  OAUTH_CALLBACK_PATH: "/api/auth/callback"
  LOG_LEVEL: "INFO"
  METRICS_ENABLED: "true"
