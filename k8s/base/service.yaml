apiVersion: v1
kind: Service
metadata:
  name: app
  labels:
    app.kubernetes.io/name: app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: app
  ports:
    - port: 80
      targetPort: http
      protocol: TCP
      name: http
  # Session affinity None → load balance evenly across pods
  sessionAffinity: None
