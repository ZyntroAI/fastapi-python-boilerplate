apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: code-server
  namespace: default
  labels:
    app.kubernetes.io/name: code-server
spec:
  serviceName: code-server-service
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: code-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: code-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        runAsNonRoot: true
      containers:
        - name: code-server
          image: codercom/code-server:latest
          imagePullPolicy: IfNotPresent
          args:
            - --auth
            - password
            - --bind-addr
            - 0.0.0.0:8080
            - /home/coder/project
          env:
            - name: PASSWORD
              valueFrom:
                secretKeyRef:
                  name: code-server-secret
                  key: PASSWORD
            # Enables telemetry disabling if required for security/compliance
            - name: DISABLE_TELEMETRY
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          volumeMounts:
            - name: coder-storage
              mountPath: /home/coder
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: coder-storage
      spec:
        accessModes:
          - ReadWriteOnce
        # Specify your cluster's StorageClass if needed (e.g., gp3, standard, local-path)
        # storageClassName: "standard"
        resources:
          requests:
            storage: 20Gi
