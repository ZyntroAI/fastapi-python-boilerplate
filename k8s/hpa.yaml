apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: oauth-fastapi
  namespace: oauth-fastapi

spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: oauth-fastapi

  minReplicas: 3
  maxReplicas: 20

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30

    scaleDown:
      stabilizationWindowSeconds: 300

  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70

    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
