//k8s/manifests/overlays/prod/patches/resource-limits.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: fullstack-app
spec:
  template:
    spec:
      containers:
        - name: api
          resources:
            requests:
              memory: "512Mi"
              cpu: "500m"
            limits:
              memory: "2Gi"
              cpu: "2000m"
