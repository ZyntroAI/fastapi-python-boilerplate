# k8s/prometheus-adapter-values.yaml
rules:
  default: false
  custom:
    - seriesQuery: >
        http_requests_total{namespace!="",pod!=""}
      resources:
        overrides:
          namespace:
            resource: namespace
          pod:
            resource: pod
      name:
        matches: "^http_requests_total$"
        as: "http_requests_per_second"
      metricsQuery: >
        sum(rate(<<.Series>>{<<.LabelMatchers>>}[2m]))
        by (<<.GroupBy>>)
