{
  "builds": [
    {
      "src": "app/main.py",
      "use": "@vercel/python"
    }
  ],
  "routes": [
    {
      "src": "/(.*)",
      "dest": "app/main.py"
    }
  ],
  "env": {
    "ENV": "vercel"
  }
}
⚠️ หมายเหตุ: Vercel รองรับ Python Serverless Functions แต่ไม่รองรับ WebSocket และ background tasks แบบ long-running
