apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth-api
  namespace: oauth
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oauth
  template:
    metadata:
      labels:
        app: oauth
    spec:
      containers:
        - name: oauth
          image: ghcr.io/your-org/oauth-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: oauth-config
            - secretRef:
                name: oauth-secrets
          readinessProbe:
            httpGet:
              path: /api/health/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
