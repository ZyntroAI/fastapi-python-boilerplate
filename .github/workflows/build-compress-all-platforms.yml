# .github/workflows/build-compress-all-platforms.yml
name: 🚀 Build & Compress - All Platforms

on:
  push:
    branches: [main, release/*]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: 'เลือกแพลตฟอร์มที่จะ build'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - ios
          - windows
          - macos
          - linux
      release_type:
        description: 'ประเภท release'
        required: true
        default: 'beta'
        type: choice
        options:
          - alpha
          - beta
          - production

env:
  # ป้องกัน "File name too long"
  GIT_CONFIG_GLOBAL: |
    [core]
      longpaths = true

jobs:
  # ═══════════════════════════════════════════════════
  # JOB 1: ตรวจสอบและเตรียมข้อมูล
  # ═══════════════════════════════════════════════════
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_number: ${{ steps.version.outputs.build_number }}
      should_build_android: ${{ steps.decide.outputs.android }}
      should_build_ios: ${{ steps.decide.outputs.ios }}
      should_build_windows: ${{ steps.decide.outputs.windows }}
      should_build_macos: ${{ steps.decide.outputs.macos }}
      should_build_linux: ${{ steps.decide.outputs.linux }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate Version
        id: version
        run: |
          VERSION=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          BUILD_NUM=${{ github.run_number }}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "## 📦 Build Info" >> $GITHUB_STEP_SUMMARY
          echo "- Version: $VERSION" >> $GITHUB_STEP_SUMMARY
          echo "- Build Number: $BUILD_NUM" >> $GITHUB_STEP_SUMMARY

      - name: Decide Build Targets
        id: decide
        run: |
          TARGET="${{ github.event.inputs.build_target || 'all' }}"
          if [ "$TARGET" == "all" ]; then
            echo "android=true" >> $GITHUB_OUTPUT
            echo "ios=true" >> $GITHUB_OUTPUT
            echo "windows=true" >> $GITHUB_OUTPUT
            echo "macos=true" >> $GITHUB_OUTPUT
            echo "linux=true" >> $GITHUB_OUTPUT
          else
            echo "android=$([ "$TARGET" == "android" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "ios=$([ "$TARGET" == "ios" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "windows=$([ "$TARGET" == "windows" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "macos=$([ "$TARGET" == "macos" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
            echo "linux=$([ "$TARGET" == "linux" ] && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
          fi

  # ═══════════════════════════════════════════════════
  # JOB 2: 📱 ANDROID
  # ═══════════════════════════════════════════════════
  build-android:
    needs: prepare
    if: needs.prepare.outputs.should_build_android == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK (Release)
        run: |
          flutter build apk --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Build AAB (Release)
        run: |
          flutter build appbundle --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Compress Android Builds
        id: compress
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          format: zip
          compression_level: '9'
          dest: ./artifacts
          destfilename: 'crystalcastleX-android-v${{ needs.prepare.outputs.version }}'

      - name: Sign APK (ถ้ามี keystore)
        if: secrets.ANDROID_KEYSTORE != ''
        uses: r0adkll/sign-android-release@v1
        with:
          releaseDirectory: build/app/outputs/flutter-apk
          signingKeyBase64: ${{ secrets.ANDROID_KEYSTORE }}
          alias: ${{ secrets.ANDROID_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-build
          path: artifacts/*.zip
          compression-level: 0

      - name: Upload to Firebase App Distribution
        if: github.event.inputs.release_type != 'production'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_ANDROID_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-release.apk

  # ═══════════════════════════════════════════════════
  # JOB 3: 🍎 iOS (ต้องใช้ macOS runner)
  # ═══════════════════════════════════════════════════
  build-ios:
    needs: prepare
    if: needs.prepare.outputs.should_build_ios == 'true'
    runs-on: macos-latest  # ⚠️ จำเป็นต้องใช้ macOS
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Setup CocoaPods
        run: |
          sudo gem install cocoapods
          pod setup

      - name: Install Apple Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12_CERTIFICATE }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        uses: apple-actions/download-provisioning-profiles@v1
        with:
          bundle-id: com.zyntroai.crystalcastleX
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Build iOS
        run: |
          flutter pub get
          flutter build ios --release --no-codesign \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Create IPA
        run: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r crystalcastleX-ios-v${{ needs.prepare.outputs.version }}.ipa Payload

      - name: Compress IPA
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: build/ios/iphoneos/crystalcastleX-ios-v${{ needs.prepare.outputs.version }}.ipa
          format: zip
          compression_level: '9'
          dest: ./artifacts
          destfilename: 'crystalcastleX-ios-v${{ needs.prepare.outputs.version }}'

      - name: Upload iOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-build
          path: artifacts/*.zip
          compression-level: 0

      - name: Upload to TestFlight
        if: github.event.inputs.release_type == 'production'
        uses: apple-actions/upload-testflight-build@v1
        with:
          app-path: build/ios/iphoneos/crystalcastleX-ios-v${{ needs.prepare.outputs.version }}.ipa
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

  # ═══════════════════════════════════════════════════
  # JOB 4: 🪟 WINDOWS (PC)
  # ═══════════════════════════════════════════════════
  build-windows:
    needs: prepare
    if: needs.prepare.outputs.should_build_windows == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enable Long Path Support
        run: |
          git config --system core.longpaths true
          New-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -PropertyType DWORD -Force

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Windows
        run: |
          flutter pub get
          flutter build windows --release `
            --build-name=${{ needs.prepare.outputs.version }} `
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Compress Windows Build
        id: compress
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: build/windows/x64/runner/Release
          format: zip
          compression_level: '9'
          dest: ./artifacts
          destfilename: 'crystalcastleX-windows-v${{ needs.prepare.outputs.version }}'

      - name: Create Installer (optional - using Inno Setup)
        if: false  # เปลี่ยนเป็น true ถ้าต้องการ
        run: |
          choco install innosetup
          iscc installer.iss

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: artifacts/*.zip
          compression-level: 0

  # ═══════════════════════════════════════════════════
  # JOB 5: 🍎 macOS DESKTOP
  # ═══════════════════════════════════════════════════
  build-macos:
    needs: prepare
    if: needs.prepare.outputs.should_build_macos == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build macOS
        run: |
          flutter pub get
          flutter build macos --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "CrystalCastleX" \
            --window-pos 200 120 \
            --window-size 800 400 \
            --icon-size 100 \
            --app-drop-link 600 185 \
            "crystalcastleX-macos-v${{ needs.prepare.outputs.version }}.dmg" \
            "build/macos/Build/Products/Release/crystalcastleX.app"

      - name: Compress macOS Build
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: crystalcastleX-macos-v${{ needs.prepare.outputs.version }}.dmg
          format: zip
          compression_level: '9'
          dest: ./artifacts
          destfilename: 'crystalcastleX-macos-v${{ needs.prepare.outputs.version }}'

      - name: Notarize macOS App (ถ้ามี Apple Developer ID)
        if: secrets.APPLE_DEVELOPER_ID != ''
        run: |
          xcrun notarytool submit "crystalcastleX-macos-v${{ needs.prepare.outputs.version }}.dmg" \
            --apple-id ${{ secrets.APPLE_ID }} \
            --team-id ${{ secrets.APPLE_TEAM_ID }} \
            --password ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }} \
            --wait

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: artifacts/*.zip
          compression-level: 0

  # ═══════════════════════════════════════════════════
  # JOB 6: 🐧 LINUX DESKTOP
  # ═══════════════════════════════════════════════════
  build-linux:
    needs: prepare
    if: needs.prepare.outputs.should_build_linux == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Build Linux
        run: |
          flutter pub get
          flutter build linux --release \
            --build-name=${{ needs.prepare.outputs.version }} \
            --build-number=${{ needs.prepare.outputs.build_number }}

      - name: Create AppImage (optional)
        run: |
          # ติดตั้ง appimagetool
          wget https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          
          # สร้าง AppImage
          ./appimagetool-x86_64.AppImage build/linux/x64/release/bundle crystalcastleX-v${{ needs.prepare.outputs.version }}.AppImage

      - name: Compress Linux Build
        id: compress
        uses: somaz94/compress-decompress@v1
        with:
          command: compress
          source: |
            build/linux/x64/release/bundle
            crystalcastleX-v${{ needs.prepare.outputs.version }}.AppImage
          format: tar.zst
          compression_level: '9'
          dest: ./artifacts
          destfilename: 'crystalcastleX-linux-v${{ needs.prepare.outputs.version }}'

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: artifacts/*.tar.zst
          compression-level: 0

  # ═══════════════════════════════════════════════════
  # JOB 7: 📦 รวมทุกแพลตฟอร์ม + Release
  # ═══════════════════════════════════════════════════
  release:
    needs: [prepare, build-android, build-ios, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: always() && github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: '*-build'
          merge-multiple: true

      - name: Create Release Notes
        run: |
          cat > RELEASE_NOTES.md << 'EOF'
          ## 🎮 CrystalCastleX v${{ needs.prepare.outputs.version }}
          
          ### 📱 แพลตฟอร์มที่รองรับ
          - 📱 Android (APK + AAB)
          - 🍎 iOS (IPA)
          - 🪟 Windows (PC)
          - 🍎 macOS (Desktop)
          - 🐧 Linux (Desktop)
          
          ### 📦 ไฟล์ดาวน์โหลด
          EOF
          
          ls -la all-artifacts/ >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: '🎮 CrystalCastleX v${{ needs.prepare.outputs.version }}'
          body_path: RELEASE_NOTES.md
          files: all-artifacts/*
          prerelease: ${{ github.event.inputs.release_type != 'production' }}

      - name: Final Summary
        run: |
          echo "## 🎉 Release Complete!" >> $GITHUB_STEP_SUMMARY
          echo "Version: ${{ needs.prepare.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "Platforms:" >> $GITHUB_STEP_SUMMARY
          echo "- Android: ${{ needs.build-android.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- iOS: ${{ needs.build-ios.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Windows: ${{ needs.build-windows.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- macOS: ${{ needs.build-macos.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Linux: ${{ needs.build-linux.result }}" >> $GITHUB_STEP_SUMMARY
