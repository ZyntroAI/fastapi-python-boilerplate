name: ⚡ Auto-Optimize
on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "0 8 * * 1"   # ทุกจันทร์เช้า
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  optimize:
    name: ⚡ ตรวจ & ปรับปรุง
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          
      - run: pip install ruff pytest pytest-cov
      
      - name: 🔍 ตรวจปัญหา
        id: scan
        run: python scripts/auto_optimize.py
        continue-on-error: true
        
      - name: ✅ ซ่อมอัตโนมัติ
        run: |
          ruff check . --fix
          ruff format .
          
      - name: 📤 ส่งกลับถ้ามีเปลี่ยน
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --staged --quiet; then
            git commit -m "⚡ auto-optimize: ปรับปรุงโค้ดอัตโนมัติ"
            git push
            echo "✅ ส่งการปรับปรุงเรียบร้อย"
          else
            echo "✅ ไม่มีอะไรต้องปรับปรุง"
          fi
