name: Claude PR Review

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  claude-review:
    name: Claude Inline Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

          prompt: |
            Review this pull request.

            Focus on:

            1. Correctness
            2. Bugs
            3. Security
            4. Authentication and authorization
            5. Performance
            6. Error handling
            7. Maintainability
            8. Tests

            Post findings as INLINE comments on the exact
            changed lines.

            Do not post generic comments when an inline
            comment can be used.

            For small, safe fixes, provide a GitHub
            suggestion block.

            Do not report:
            - Style-only nitpicks
            - Existing issues unrelated to this PR
            - Issues already covered by CI/linter

            If no significant issue exists, leave a short
            review summary.

          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr comment:*)"
