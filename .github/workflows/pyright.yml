name: Pyright Type Check

on:
  pull_request:
    branches: [ main, develop ]
    paths:
      - "**.py"
      - "pyproject.toml"
      - "pyrightconfig.json"
      - "requirements*.txt"
      - ".github/workflows/pyright.yml"

permissions:
  contents: read

jobs:
  pyright:
    name: Run Pyright
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: uses: uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyright

      - name: Run Pyright
        run: pyright
