#.github/workflows/compress-build.yml
name: 📦 Auto Compress Build Artifacts
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3 # try v3 first. If still blocked, ask admin to allow v3/v4

      - name: Install zstd
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Compress Build Output
        run: |
          mkdir -p./artifacts
          zstd -3 -o./artifacts/build-release.tzst./dist
          echo "FILE_PATH=./artifacts/build-release.tzst" >> $GITHUB_OUTPUT
          echo "ORIGINAL_SIZE=$(du -b./dist | awk '{sum+=$1} END {print sum}')" >> $GITHUB_OUTPUT
          echo "COMPRESSED_SIZE=$(stat -c%s./artifacts/build-release.tzst)" >> $GITHUB_OUTPUT
          echo "FILE_COUNT=$(find./dist -type f | wc -l)" >> $GITHUB_OUTPUT
          echo "CHECKSUM=$(sha256sum./artifacts/build-release.tzst | awk '{print $1}')" >> $GITHUB_OUTPUT
          echo "DURATION=0" >> $GITHUB_OUTPUT

      - name: Upload Artifact
        uses: actions/upload-artifact@v3 # try v3. If blocked, ask admin
        with:
          name: compressed-build
          path:./artifacts/build-release.tzst
          if-no-files-found: error

      - name: Report Compression Stats
        run: |
          echo "📦 Archive:./artifacts/build-release.tzst"
          echo "📁 Files: $(find./dist -type f | wc -l)"
          echo "📊 Original: $(du -b./dist | awk '{sum+=$1} END {print sum}') bytes"
          echo "📉 Compressed: $(stat -c%s./artifacts/build-release.tzst) bytes"
          echo "🔐 SHA256: $(sha256sum./artifacts/build-release.tzst | awk '{print $1}')"
