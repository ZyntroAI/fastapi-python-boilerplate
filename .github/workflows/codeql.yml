The content you provided appears to be a raw dump of a GitHub repository page (specifically `fastapi-python-boilerplate`) showing the file structure and the contents of a `codeql.yml` workflow file.

It looks like the file currently contains **two separate workflow definitions** concatenated together, which is invalid YAML for a single GitHub Actions file. GitHub Actions files must have exactly one top-level `name` and `on` definition per file (or multiple jobs under a single definition).

Here is a refactored, valid version of the `codeql.yml` file that merges the best practices from both sections (the "Advanced" setup with the matrix strategy and the specific language list) while removing the duplication and fixing the version tags.

### Refactored `codeql.yml`

This version:
1.  Uses the **CodeQL Advanced** setup (matrix strategy) which is more flexible.
2.  Scans **Python**, **JavaScript/TypeScript**, and **GitHub Actions**.
3.  Uses the latest stable versions of the `actions/checkout` and `github/codeql-action` (v4).
4.  Removes the duplicate second workflow block.
5.  Keeps the scheduled scan (every Sunday at 17:21 UTC).

```yaml
name: CodeQL Advanced

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    - cron: '21 17 * * 0' # Runs at 17:21 UTC every Sunday
  workflow_dispatch: # Allows manual triggering

permissions:
  # Required for all workflows
  security-events: write
  # Required to fetch internal or private CodeQL packs
  packages: read
  # Required for private repositories
  actions: read
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          - language: javascript-typescript
            build-mode: none
          - language: python
            build-mode: none

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          # If you wish to specify custom queries, you can do so here or in a config file.
          # By default, queries listed here will override any specified in a config file.
          # Prefix the list here with "+" to use these queries and those in the config file.
          # queries: security-extended,security-and-quality

      # If the analyze step fails with "We were unable to automatically build your code",
      # modify the matrix above to set the build mode to "manual" for that language.
      - name: Run manual build steps
        if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode, replace this with the commands to build your code.'
          echo 'Example: make bootstrap'
          echo 'Example: make release'
          exit 1

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
```

### Key Changes Made:
*   **Merged Definitions**: Combined the two conflicting `name` and `on` blocks into a single, valid workflow.
*   **Updated Actions**: Upgraded `actions/checkout` from `v7` (which may not exist or be unstable) to `v4` (the current stable major version) and ensured `github/codeql-action` uses `@v4`.
*   **Removed Placeholders**: The second block in your source had `<FULL_CODEQL_COMMIT_SHA>` placeholders which would cause the workflow to fail. The refactored version uses the stable `@v4` tag.
*   **Simplified Logic**: Removed the redundant "Autobuild" step in favor of the matrix-driven `build-mode: none` for interpreted languages (Python, JS, Actions), which is the correct approach for this boilerplate.

You can commit this directly to your `.github/workflows/codeql.yml` file.
