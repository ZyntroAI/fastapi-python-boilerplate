name: FastAPI CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/zyntroai/fastapi-boilerplate
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57c3d3c42e288026812cd22362661c4e8d4
      - uses: actions/setup-python@5fda3b9c709277f8cf4290f3a0094ab7e95c1338
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff black isort
      - run: ruff check .
      - run: black --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: actions/checkout@f548e57c3d3c42e288026812cd22362661c4e8d4
      - uses: actions/setup-python@5fda3b9c709277f8cf4290f3a0094ab7e95c1338
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r requirements.txt
      - run: pytest --cov=app
      - name: Upload Coverage
        uses: codecov/codecov-action@eaaf46c7cd7896392741f9d0acf77d8b12592391

  security:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@f548e57c3d3c42e288026812cd22362661c4e8d4
      - uses: actions/setup-python@5fda3b9c709277f8cf4290f3a0094ab7e95c1338
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: github/codeql-action/init@977e6ce40888f41234c9b3252437dcf2331daaa2
      - uses: github/codeql-action/autobuild@977e6ce40888f41234c9b3252437dcf2331daaa2
      - uses: github/codeql-action/analyze@977e6ce40888f41234c9b3252437dcf2331daaa2

  build:
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@f548e57c3d3c42e288026812cd22362661c4e8d4
      - name: Log in to GHCR
        uses: docker/login-action@74a5d146c4c96f6db1f1a614812d3d27e93654e7
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@4a13b6b08c6420d408f900f841204c8c413bdd32
        with:
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest