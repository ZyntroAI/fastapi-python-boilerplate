name: CI – Full Automation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    fail-fast: false
    matrix:
      python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0a5c61591373683505ea898e09a731b4b826dc05 # v5.3.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --asyncio-mode=auto

      - name: Upload test results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb48e8 # v4.4.0
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            pytest-asyncio/
            .pytest_cache/
          retention-days: 7

  update-docs:
    name: Update Documentation
    needs: unit-tests
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Docs updated successfully
        run: echo "✅ Documentation updated successfully"

  notify:
    name: Notify & Summary
    needs: [unit-tests, update-docs]
    runs-on: ubuntu-24.04
    if: always()
    steps:
      - name: Determine overall status
        id: status
        run: |
          TESTS_STATUS="${{ needs.unit-tests.result }}"
          DOCS_STATUS="${{ needs.update-docs.result }}"
          echo "TESTS_STATUS=$TESTS_STATUS" >> $GITHUB_OUTPUT
          echo "DOCS_STATUS=$DOCS_STATUS" >> $GITHUB_OUTPUT
          
          if [[ "$TESTS_STATUS" == "success" && ("$DOCS_STATUS" == "success" || "$DOCS_STATUS" == "skipped") ]]; then
            echo "STATUS=✅ สำเร็จ" >> $GITHUB_OUTPUT
            echo "EXIT_CODE=0" >> $GITHUB_OUTPUT
          else
            echo "STATUS=❌ ไม่สำเร็จ" >> $GITHUB_OUTPUT
            echo "EXIT_CODE=1" >> $GITHUB_OUTPUT
          fi

      - name: Output result
        run: |
          echo "${{ steps.status.outputs.STATUS }}"
          exit ${{ steps.status.outputs.EXIT_CODE }}
        env:
          STATUS: ${{ steps.status.outputs.STATUS }}
          EXIT_CODE: ${{ steps.status.outputs.EXIT_CODE }}
