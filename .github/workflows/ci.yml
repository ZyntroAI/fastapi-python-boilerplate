name: FastAPI CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch: {} # เรียกใช้ด้วยมือได้

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/zyntroai/fastapi-boilerplate
  REGISTRY: ghcr.io

jobs:
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71903a754fa4acce1b6cd295a12fc38ffd4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@8d9ed9ac65efc6b600b45b871c877404878e487
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Tools
        run: python -m pip install --upgrade pip ruff black isort
      
      - name: 🔍 Ruff Check
        run: ruff check .
      
      - name: ✅ Black Format
        run: black --check .

  test:
    name: 🧪 Test & Coverage
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71903a754fa4acce1b6cd295a12fc38ffd4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@8d9ed9ac65efc6b600b45b871c877404878e487
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Dependencies
        run: pip install --upgrade pip -r requirements.txt
      
      - name: 🧪 Run Tests
        run: |
          pytest tests/ -v \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
      
      - name: 📤 Upload Coverage
        uses: codecov/codecov-action@e28ff1a9040ecb616af543a4d4fdb401c171bb2f
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-coverage
          fail_ci_if_error: false
          verbose: true

  security:
    name: 🔒 Security Scan
    needs: test
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71903a754fa4acce1b6cd295a12fc38ffd4
        with:
          fetch-depth: 2
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@8d9ed9ac65efc6b600b45b871c877404878e487
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: 📦 Install Deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔍 Initialize CodeQL
        uses: github/codeql-action/init@407ffafae6a767df5e7430c3dfb94ac745661ddc
        with:
          languages: python
          build-mode: none
      
      - name: 🛠️ Autobuild
        uses: github/codeql-action/autobuild@407ffafae6a767df5e7430c3dfb94ac745661ddc
      
      - name: 📊 Analyze
        uses: github/codeql-action/analyze@407ffafae6a767df5e7430c3dfb94ac745661ddc
        with:
          category: "/language:python"

  build:
    name: 🐳 Build & Push Image
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@11bd71903a754fa4acce1b6cd295a12fc38ffd4
      
      - name: 🔐 Login GHCR
        uses: docker/login-action@0d9c0874d424b1842f8e7245110a4b06ab55d23a
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 🚀 Build & Push
        uses: docker/build-push-action@4f24a5b132219d0783ab247d10c054b9b88528c6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
