name: FastAPI CI/CD

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: ghcr.io/zyntroai/fastapi-boilerplate
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ env.PYTHON_VERSION }}}
      - run: python -m pip install ruff black isort
      - run: ruff check .
      - run: black --check .

  test:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: {POSTGRES_USER: test, POSTGRES_PASSWORD: test, POSTGRES_DB: test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ env.PYTHON_VERSION }}}
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --cov=app --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test

  security:
    needs: test
    runs-on: ubuntu-latest
    permissions:                   # ✅ เพิ่ม: สิทธิ์จำเป็นสำหรับ CodeQL
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2            # ✅ เพิ่ม: ดึงประวัติเพียงพอ

      - name: Set up Python        # ✅ เพิ่ม: ให้ CodeQL เห็นสภาพแวดล้อม
        uses: actions/setup-python@v5
        with: {python-version: ${{ env.PYTHON_VERSION }}}

      - name: Install dependencies  # ✅ เพิ่ม: ช่วยวิเคราะห์ความสัมพันธ์
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python
          build-mode: none          # ✅ Python ไม่ต้องคอมไพล์

      - name: Autobuild             # ✅ เพิ่ม: แก้ "No source code seen"
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:python"

  build:
    needs: security
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}:latest
