name: FastAPI — CI (Lint & Test)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/ci.yml'

permissions:
  contents: read
  checks: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  lint:
    name: 🧹 Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d275971364c9af68 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a731b4d133a39d # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - run: pip install --upgrade pip ruff black mypy
      - run: ruff check src/ tests/
      - run: black --check --diff src/ tests/

  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d275971364c9af68 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a731b4d133a39d # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - run: pytest tests/ --cov=src --cov-report=term --cov-report=xml

      - uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb48e8 # v4.4.3
        with:
          name: coverage-report
          path: coverage.xml

  validate:
    name: ✅ App Validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: test
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d275971364c9af68 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a731b4d133a39d # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: |
          pip install -r requirements.txt
          python -c "from src.main import app; print('✅ App loaded')"
