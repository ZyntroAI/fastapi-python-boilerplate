  - name: Run Gitleaks
    # ใช้ Commit SHA ของ gitleaks-action (เช่น v2.3.9)
    uses: gitleaks/gitleaks-action@82d02c6d5952f1e67040409a88eb052b6d1947b7 # v2.3.9
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
