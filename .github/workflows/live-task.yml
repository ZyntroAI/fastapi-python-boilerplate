name: Live Task Service CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'workers/**'
      - 'tests/**'
      - '.github/workflows/live-task.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'apps/**'
      - 'core/**'
      - 'workers/**'
      - 'tests/**'
      - '.github/workflows/live-task.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-typecheck:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy

      - name: Run Ruff (Linter & Formatter Check)
        run: |
          ruff check apps core workers tests
          ruff format --check apps core workers tests

      - name: Run MyPy (Type Checking)
        run: |
          mypy apps core workers

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest pytest-cov

      - name: Execute Unit Tests
        run: |
          pytest tests/unit/ \
            --cov=core \
            --cov=apps \
            --cov=workers \
            --cov-report=term-missing \
            --cov-report=xml:coverage-unit.xml

      - name: Upload Unit Coverage Report
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage-report
          path: coverage-unit.xml

  integration-and-e2e-tests:
    name: Integration & E2E Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest

      - name: Execute Integration Tests
        run: |
          pytest tests/integration/

      - name: Execute End-to-End Tests
        run: |
          pytest tests/e2e/
