name: FastAPI CI

# ✅ ปิด Alert #10 — กำหนดสิทธิ์ชัดเจน
permissions:
  contents: read
  pull-requests: read
  checks: write
  statuses: write

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  run-tests:
    name: Run Tests & Upload Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5  # ✅ อัปเดตเพื่อลดเตือน Node.js

      - name: Set up Python 3.12
        uses: actions/setup-python@v6  # ✅ อัปเดต
        with:
          python-version: "3.12"
          cache: 'pip'

      - name: Upgrade pip & install base tools
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Dependencies
        run: |
          python -m pip install --retries 5 -r requirements.txt
          python -m pip list

      - name: Run Pytest with Coverage
        run: |
          python -m pytest tests/ --cov=app --cov-report=term --cov-report=xml --cov-fail-under=70
        continue-on-error: false

      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
