# .github/workflows/compress-web-assets.yml
name: 🌐 Auto Compress Web Assets
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Build Project
        run: npm ci && npm run build

      - name: Compress with Brotli & Gzip
        uses: stefh/ghaction-CompressFiles@v2
        with:
          path: ./dist
          extensions: '.js,.css,.html,.json,.svg'
          tools: 'brotli,gzip'
          depth: '5'

      - name: Upload Compressed Assets
        uses: actions/upload-artifact@v4
        with:
          name: web-assets-compressed
          path: |
            ./dist/**/*.js
            ./dist/**/*.css
            ./dist/**/*.html
            ./dist/**/*.br      # Brotli
            ./dist/**/*.gz      # Gzip
          compression-level: 0
