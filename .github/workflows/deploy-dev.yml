name: Deploy Dev

on:
  push:
    branches:
      - develop

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Dev
    runs-on: ubuntu-latest

    environment:
      name: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build \
            -t app:${{ github.sha }} \
            .

           - name: Configure kubectl
        uses: azure/setup-kubectl@v4

      - name: Deploy Kubernetes
        run: |
          kubectl -n dev set image deployment/app \
            app=app:${{ github.sha }}

          kubectl -n dev rollout status deployment/app