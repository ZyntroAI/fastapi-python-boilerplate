name: FastAPI — CD

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  deployments: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production

    # รอ CI ผ่านก่อนเสมอ — ป้องกันโค้ดเสียไป production
    needs:
      - lint
      - test
      - validate

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d275971364c9af68 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a731b4d133a39d # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # 🚀 ปรับแต่งส่วนนี้ตามแพลตฟอร์มจริงของคุณ
      - name: ✅ Deployment Placeholder
        run: |
          echo "✅ CI passed — ready to deploy"
          echo "👉 Edit .github/workflows/cd.yml to add your deployment steps"
