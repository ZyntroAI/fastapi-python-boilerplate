name: FastAPI — CD (Deploy)

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'requirements.txt'
      - '.github/workflows/cd.yml'

permissions:
  contents: read
  deployments: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    # รอ CI ผ่านก่อนเสมอ
    needs:
      - lint
      - test
      - validate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d275971364c9af68 # v4.2.2

      - uses: actions/setup-python@0a5c61591373683505ea898e09a731b4d133a39d # v5.2.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: 📦 Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ==============================================
      # 🚀 ปรับแต่งขั้นตอนปรับใช้ตามแพลตฟอร์มของคุณ
      # ==============================================

      - name: 🐳 Build & Push Docker
        if: false # เปลี่ยนเป็น true เมื่อพร้อม
        run: |
          docker build -t ghcr.io/ZyntroAI/fastapi-python-boilerplate:latest .
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          docker push ghcr.io/ZyntroAI/fastapi-python-boilerplate:latest

      - name: 📤 Deploy via SSH
        if: false # เปลี่ยนเป็น true เมื่อพร้อม
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/app
            git pull origin main
            pip install -r requirements.txt
            systemctl restart fastapi

      - name: ✅ Deployment Complete
        run: |
          echo "✅ Deployed successfully — $(date)"
