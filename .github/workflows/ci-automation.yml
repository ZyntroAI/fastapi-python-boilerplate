name: CI — Full Automation

on:
  pull_request:
    branches: [main, master]

jobs:
  unit-tests:
    name: Run Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=.

      - name: Upload test results
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  update-docs:
    name: Update Documentation
    needs: unit-tests
    runs-on: ubuntu-24.04
    if: success()
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Your doc update steps here
      - name: Docs updated
        run: echo "✅ Documentation updated successfully"

  notify:
    name: Notify & Summary
    needs: [unit-tests, update-docs]
    runs-on: ubuntu-24.04
    if: always()
    
    steps:
      - name: Determine overall status
        shell: bash
        run: |
          TESTS_STATUS="${{ needs.unit-tests.result }}"
          DOCS_STATUS="${{ needs.update-docs.result }}"
          
          if [[ "$TESTS_STATUS" == "success" && "$DOCS_STATUS" != "failure" ]]; then
            echo "STATUS=✅ สำเร็จ" >> $GITHUB_ENV
            echo "EXIT_CODE=0" >> $GITHUB_ENV
          else
            echo "STATUS=❌ มีข้อผิดพลาด" >> $GITHUB_ENV
            echo "EXIT_CODE=1" >> $GITHUB_ENV
          fi

      - name: Output result
        run: |
          echo "📊 ผลการทำงาน: $STATUS"
          exit $EXIT_CODE
        env:
          STATUS: ${{ env.STATUS }}
          EXIT_CODE: ${{ env.EXIT_CODE }}
