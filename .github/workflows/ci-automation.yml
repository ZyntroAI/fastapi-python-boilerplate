name: CI — Full Automation

on:
  pull_request:
    branches: [ main, master ]

jobs:
  unit-tests:
    name: 🧪 ตรวจสอบโค้ด & ทดสอบ (Python ${{ matrix.python-version }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@0a5c61591373683505ea898e09a97310549300a8 # v5.5.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v --cov=.

      - name: Upload test results
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb48e1 # v4.4.3
        with:
          name: test-results-${{ matrix.python-version }}
          path: |
            .pytest_cache
            htmlcov/
          retention-days: 7

  update-docs:
    name: 📄 อัปเดตเอกสาร
    runs-on: ubuntu-24.04
    needs: unit-tests
    if: always() && needs.unit-tests.result == 'success'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # your doc steps here

  notify:
    name: 📢 แจ้งผล
    runs-on: ubuntu-24.04
    needs: [unit-tests, update-docs]
    if: always()
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Check results
        run: |
          if [ "${{ needs.unit-tests.result }}" = "success" ] && \
             [ "${{ needs.update-docs.result }}" != "failure" ]; then
            echo "STATUS=✅ สำเร็จ" >> $GITHUB_ENV
            exit 0
          else
            echo "STATUS=❌ มีข้อผิดพลาด" >> $GITHUB_ENV
            exit 1
          fi
      - name: Output result
        run: |
          echo "ผลการทำงาน: $STATUS"
