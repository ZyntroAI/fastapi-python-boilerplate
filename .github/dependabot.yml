version: 2
updates:
  # ============================================
  # Backend (NestJS + Prisma) — Primary Dependencies
  # ============================================
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10

    # 🧩 Group Updates by Type
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"

      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"

      production-deps:
        dependency-type: "production"
        exclude-patterns:
          - "@nestjs/*"
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"

      development-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

    # 🛡️ Block ALL major version auto-updates (prevent breaking changes)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    labels:
      - "dependencies"
      - "backend"

    commit-message:
      prefix: "chore(deps)"
      include: "scope"

    reviewers:
      - "zyntromedia"

    rebase-strategy: "auto"

  # ============================================
  # Root — Future package.json (if added)
  # ============================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5

    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

    labels:
      - "dependencies"

    commit-message:
      prefix: "chore(deps)"

  # ============================================
  # GitHub Actions — Workflow Updates
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"

    open-pull-requests-limit: 5

    groups:
      actions:
        patterns:
          - "*"

    labels:
      - "dependencies"
      - "github-actions"

    commit-message:
      prefix: "chore(ci)"
