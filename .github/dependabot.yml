version: 2
updates:
  # ============================================
  # Backend (NestJS + Prisma) - ตำแหน่งหลัก
  # ============================================
  - package-ecosystem: "npm"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    # แยก PR ตามประเภท
    groups:
      nestjs:
        patterns:
          - "@nestjs/*"
        update-types:
          - "minor"
          - "patch"
      prisma:
        patterns:
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
      production-deps:
        dependency-type: "production"
        exclude-patterns:
          - "@nestjs/*"
          - "@prisma/*"
          - "prisma"
        update-types:
          - "minor"
          - "patch"
      development-deps:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    # ไม่ให้ major version กระโดดอัตโนมัติ (กันพัง)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "zyntromedia"          # เปลี่ยนเป็น username จริงได้
    # ถ้ามี private registry หรือต้องการ rebase อัตโนมัติ
    rebase-strategy: "auto"

  # ============================================
  # Root (เผื่อมี package.json ในอนาคต)
  # ============================================
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # ============================================
  # GitHub Actions (อัปเดต actions อัตโนมัติ)
  # ============================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
