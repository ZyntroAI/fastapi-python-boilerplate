version: 2
updates:
  # Python / pip — production deps in root requirements.txt (used by CI)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python", "pip", "auto-merge"]
    reviewers: ["zyntromedia"]
    assignees: ["zyntromedia"]
    commit-message:
      prefix: "deps(pip)"
      include: "scope"
    groups:
      production-deps: { dependency-type: "production" }
      dev-deps: { dependency-type: "development" }

  # pytest dev/test deps
  - package-ecosystem: "pip"
    directory: "/pytest"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 3
    labels: ["dependencies", "python", "pip", "auto-merge"]
    reviewers: ["zyntromedia"]
    assignees: ["zyntromedia"]
    commit-message:
      prefix: "deps(pip)"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 10
    labels: ["dependencies", "github-actions", "auto-merge"]
    reviewers: ["zyntromedia"]
    assignees: ["zyntromedia"]
    commit-message:
      prefix: "ci(actions)"
      include: "scope"

  # npm / JS — root package.json
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "03:00"
      timezone: "Asia/Bangkok"
    open-pull-requests-limit: 5
    labels: ["dependencies", "javascript", "npm", "auto-merge"]
    reviewers: ["zyntromedia"]
    assignees: ["zyntromedia"]
    commit-message:
      prefix: "deps(npm)"
      include: "scope"
    groups:
      production-deps: { dependency-type: "production" }
      dev-deps: { dependency-type: "development" }

  # Docker — no auto-merge (safer default)
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "saturday"
    open-pull-requests-limit: 3
    labels: ["dependencies", "docker"]
    commit-message:
      prefix: "chore(docker)"
