apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "oauth-app.fullname" . }}
spec:
  replicas: 2
  selector:
    matchLabels:
      app: oauth
  template:
    metadata:
      labels:
        app: oauth
    spec:
      containers:
        - name: oauth
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          ports:
            - containerPort: 8000
          env:
            - name: BASE_URL
              value: "{{ .Values.baseUrl }}"
            - name: OAUTH_PROVIDER
              value: "{{ .Values.oauth.provider }}"
            - name: OAUTH_SCOPES
              value: "{{ .Values.oauth.scopes }}"
            - name: OAUTH_CALLBACK_PATH
              value: "{{ .Values.oauth.callbackPath }}"
            - name: JWT_ALG
              value: "HS256"
            - name: JWT_TTL_SECONDS
              value: "3600"
            - name: LOG_LEVEL
              value: "INFO"
            - name: METRICS_ENABLED
              value: "true"
          # secret ให้แยกไปใน chart template อื่น
