# .github/workflows/skills-tests.yml
name: Skills Tests

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills-tests.yml"

jobs:
  workflow-permission-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: pytest skills/workflow-permission-check/tests --maxfail=1 --disable-warnings -q

  workflow-repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
