# .github/workflows/permission-check-tests.yml
name: Permission Check Tests

on:
  pull_request:
    paths:
      - "skills/workflow-permission-check/**"
      - ".github/workflows/permission-check-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run tests
        run: |
          pytest skills/workflow-permission-check/tests --maxfail=1 --disable-warnings -q
