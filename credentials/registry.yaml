# ❌ NO RAW SECRETS — References & Metadata only
# Real values live in the external vault / secret manager via the broker.

fastapi-app:
  id: fastapi-app
  provider: internal
  type: service_account
  scopes: ["api:read", "api:write"]
  expires_at: null
  storage:
    type: vault
    reference: "secret/fastapi/default"
  status: active
  lease:
    max_duration: 15m

github-workflow:
  id: github-workflow
  provider: github
  type: app_token
  scopes: ["contents:write", "workflows:write"]
  expires_at: 2026-10-01T00:00:00Z
  storage:
    type: secret_manager
    reference: "github/zyntro-bot"
  status: active
