# Postgres for local development.
#
#   docker compose up -d          # start
#   docker compose down           # stop (data is kept in the named volume)
#   docker compose down -v        # stop and wipe the data
#
# The credentials below match server/.env.example, so no extra wiring is needed.

services:
  postgres:
    image: postgres:16-alpine
    container_name: product-crud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: products
      # Deterministic collation, so ORDER BY name does not shift between machines.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "5432:5432"
    volumes:
      - product_crud_pgdata:/var/lib/postgresql/data
    healthcheck:
      # `up -d` alone returns before Postgres accepts connections, which makes
      # `prisma migrate` fail intermittently. This lets callers wait properly:
      #   docker compose up -d --wait
      test: ["CMD-SHELL", "pg_isready -U postgres -d products"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  product_crud_pgdata:
