apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: onspace-redis
  namespace: onspaceai
spec:
  serviceName: onspace-redis
  replicas: 1
  selector:
    matchLabels: { app: onspace-redis }
  template:
    metadata:
      labels: { app: onspace-redis }
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports: [{ containerPort: 6379 }]
          volumeMounts: [{ name: redis-data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: redis-data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests: { storage: 1Gi }
