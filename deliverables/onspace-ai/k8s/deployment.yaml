apiVersion: apps/v1
kind: Deployment
metadata:
  name: onspace-ai
  namespace: onspaceai
spec:
  replicas: 2
  selector:
    matchLabels: { app: onspace-ai }
  template:
    metadata:
      labels: { app: onspace-ai }
    spec:
      containers:
        - name: api
          image: onspace-ai:latest
          ports: [{ containerPort: 8000 }]
          envFrom: [{ secretRef: { name: onspace-env } }]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 5 }
          livenessProbe: { httpGet: { path: /health, port: 8000 }, initialDelaySeconds: 10 }
