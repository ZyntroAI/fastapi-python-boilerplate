apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: onspace-ai
  namespace: onspaceai
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: onspace-ai
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
