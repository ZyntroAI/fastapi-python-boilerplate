name: Auto Label

# Applies labels to a PR from its conventional-commit type + changed paths.
# Only ever ADDS labels — never removes one a human set.
#
# This file belongs in .github/workflows/auto-label.yml. It ships here because
# the fig-ai-agent GitHub App lacks the `workflows` scope, which blocks pushes
# that touch .github/workflows/**. Move it with:
#
#     git mv deliverables/ci/auto-label.yml .github/workflows/auto-label.yml
#
# The classifier it calls (skills/auto-label/classify.py) is already on main.
#
# All actions are pinned to full commit SHAs per repo policy. The SHAs below
# were resolved from the public API on 2026-09-15 — they are real:
#   actions/checkout      v4.2.2  11bd71901bbe5b1630ceea73d27597364c9af683
#   actions/setup-python  v5.3.0  0b93645e9fea7318ecaed2b359559ac225c90a2b
#   actions/github-script v7.0.1  60a0d83039c74a4aee543508d2ffcb1c3799cdea

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: auto-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"

      - name: Classify
        id: classify
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # Collect changed paths without needing the PR to be checked out.
          gh pr view "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --json files --jq '.files[].path' > /tmp/paths.txt

          ARGS=()
          while IFS= read -r p; do ARGS+=(--path "$p"); done < /tmp/paths.txt

          python skills/auto-label/classify.py \
            --title "$PR_TITLE" "${ARGS[@]}" --json > /tmp/labels.json

          echo "labels=$(python -c "import json;print(','.join(json.load(open('/tmp/labels.json'))['labels']))")" >> "$GITHUB_OUTPUT"

      - name: Apply
        if: steps.classify.outputs.labels != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        env:
          LABELS: ${{ steps.classify.outputs.labels }}
        with:
          script: |
            const wanted = process.env.LABELS.split(',').map(s => s.trim()).filter(Boolean);
            if (wanted.length === 0) return;

            // Additive only: compare against what is already there and add the
            // difference. We never call removeLabel.
            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const have = new Set(existing.map(l => l.name));
            const toAdd = wanted.filter(l => !have.has(l));
            if (toAdd.length === 0) {
              core.info('nothing to add');
              return;
            }
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: toAdd,
            });
            core.info(`added: ${toAdd.join(', ')}`);
