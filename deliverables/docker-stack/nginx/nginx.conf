# Reverse-proxy front end for the API (optional `proxy` profile).
#
# Terminates the client connection, adds the usual upstream headers, and keeps
# the health endpoint off the access log so probes do not drown real traffic.

upstream api_upstream {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Uploads are not part of this API yet; keep a sane cap.
    client_max_body_size 10m;

    # Do not log liveness/readiness probes. /health must be matched exactly —
    # a prefix match on "/health" would also swallow /health/ready.
    location = /health/live {
        access_log off;
        proxy_pass http://api_upstream;
    }
    location = /health {
        access_log off;
        proxy_pass http://api_upstream;
    }

    location / {
        proxy_pass         http://api_upstream;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Required for SSE / streaming responses to flush promptly.
        proxy_set_header   Connection        "";
        proxy_buffering    off;

        proxy_connect_timeout 5s;
        proxy_read_timeout    120s;
    }
}
