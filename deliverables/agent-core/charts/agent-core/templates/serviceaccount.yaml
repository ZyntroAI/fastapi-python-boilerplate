apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "agent-core.serviceAccountName" . }}
  labels:
    {{- include "agent-core.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The app only needs to reach the provider API and Supabase — not the API server.
automountServiceAccountToken: false
