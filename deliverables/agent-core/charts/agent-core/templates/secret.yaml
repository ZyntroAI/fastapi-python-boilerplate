{{- if .Values.secrets.existingSecret }}
{{/* Using an external Secret — nothing to render here. */}}
{{- else if or .Values.secrets.AGENT_API_KEY .Values.secrets.SUPABASE_URL .Values.secrets.SUPABASE_SERVICE_KEY }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-core.secretName" . }}
  labels:
    {{- include "agent-core.labels" . | nindent 4 }}
type: Opaque
stringData:
  AGENT_API_KEY: {{ .Values.secrets.AGENT_API_KEY | quote }}
  SUPABASE_URL: {{ .Values.secrets.SUPABASE_URL | quote }}
  SUPABASE_SERVICE_KEY: {{ .Values.secrets.SUPABASE_SERVICE_KEY | quote }}
{{- else }}
{{/*
No secret values and no existing Secret: render nothing rather than an empty
Secret. The Deployment still references the name, so an out-of-band Secret
(or a sync from a secrets manager) can supply it.
*/}}
{{- end }}
