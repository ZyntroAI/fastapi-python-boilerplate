# A SHA-pinned workflow — the form DEPLOYMENT requires.
name: quality-gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd719018748d22c79cda53317c56e7975d6772
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python deliverables/fig-best-practices/quality_gate.py --root . --json
