name: Full CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  schedule:
    - cron: "0 3 * * 1"   # weekly security re-scan (Monday 03:00 UTC)
  workflow_dispatch:

concurrency:
  group: pipeline-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ── Stage 1: Quality ────────────────────────────────────────────────
  python-ci:
    name: Quality
    uses: ./.github/workflows/reusable-python-ci.yml
    with:
      python-version: "3.12"

  # ── Stage 2: Security ───────────────────────────────────────────────
  security-scan:
    name: Security
    uses: ./.github/workflows/reusable-security-scan.yml
    with:
      python-version: "3.12"
      run-codeql: true
    permissions:
      contents: read
      security-events: write

  # ── Stage 3: Build (build-only, never pushes on a PR) ────────────────
  docker-build:
    name: Build
    needs: [python-ci, security-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Build image (no push)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          push: false
          tags: app:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Stage 4: Gate — the single required check ────────────────────────
  ci-gate:
    name: CI Gate
    if: always()
    needs: [python-ci, security-scan, docker-build]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate upstream results
        run: |
          echo "quality=${{ needs.python-ci.result }}"
          echo "security=${{ needs.security-scan.result }}"
          echo "build=${{ needs.docker-build.result }}"
          failed=0
          for r in "${{ needs.python-ci.result }}" \
                   "${{ needs.security-scan.result }}" \
                   "${{ needs.docker-build.result }}"; do
            if [ "$r" != "success" ]; then
              echo "::error::upstream job did not succeed: $r"
              failed=1
            fi
          done
          [ "$failed" -eq 0 ] || exit 1
          echo "All pipeline stages green."
