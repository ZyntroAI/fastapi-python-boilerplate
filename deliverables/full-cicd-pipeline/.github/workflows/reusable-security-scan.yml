name: Reusable — Security Scan

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version used for dependency resolution
        required: false
        type: string
        default: "3.12"
      run-codeql:
        description: Run CodeQL analysis for Python
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ inputs.python-version }}
      - name: pip-audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --strict --desc || exit 1

  codeql:
    name: CodeQL
    if: ${{ inputs.run-codeql }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - name: Initialize CodeQL
        uses: github/codeql-action/init@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
        with:
          languages: python
      - name: Autobuild
        uses: github/codeql-action/autobuild@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
      - name: Analyze
        uses: github/codeql-action/analyze@faaca9a8f6edddba5725ffe5adefdab6669a2eca  # v3
