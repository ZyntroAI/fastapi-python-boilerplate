name: Deploy (OIDC keyless)

# Layer 1 — OIDC zero-touch. No long-lived cloud credentials are stored.
# GitHub mints a short-lived JWT per job; the cloud provider exchanges it for
# temporary credentials. Nothing to leak, nothing to rotate manually.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: deny everything by default, then grant the minimum.
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://api.zyntroai.example

    permissions:
      contents: read   # checkout
      id-token: write  # REQUIRED for OIDC — the only extra grant

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No secrets.* referenced here at all — the role is assumed via OIDC.
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/gh-actions-zyntroai
          role-session-name: github-deploy
          aws-region: ap-southeast-1

      - name: Deploy
        env:
          # Dual-key friendly: prefer the rotated key, fall back to the old one.
          API_KEY: ${{ secrets.API_KEY_V2 || secrets.API_KEY }}
        run: ./deploy.sh
