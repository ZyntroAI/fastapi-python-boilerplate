name: Azure Bicep Deploy

on:
  push:
    branches: [main]
    paths: ['infra/**']
  workflow_dispatch:

permissions:
  id-token: write   # จำเป็นสำหรับ OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # เข้าสู่ระบบ Azure ด้วย OIDC — ไม่ต้องเก็บ client secret
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Lint Bicep
        run: az bicep build --file infra/main.bicep

      # จัดกลุ่ม log ให้อ่านง่าย
      - name: What-if (preview changes)
        run: |
          echo "::group::What-if preview"
          az deployment group what-if \
            --resource-group "$RG_NAME" \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam
          echo "::endgroup::"

      - name: Deploy
        id: deploy
        env:
          RG_NAME: rg-app-prod-01
        run: |
          # warning annotation ตัวอย่างเมื่อ env ไม่ครบ
          if [[ -z "$AZURE_SUBSCRIPTION_ID" ]]; then
            echo "::warning title=Config::AZURE_SUBSCRIPTION_ID not set on secret"
          fi

          az deployment group create \
            --resource-group "$RG_NAME" \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam

          # เขียนผลลัพธ์ลง $GITHUB_OUTPUT ให้ step ถัดไปใช้
          STORAGE=$(az deployment group show \
            --resource-group "$RG_NAME" \
            --name main \
            --query "properties.outputs.storageName.value" -o tsv)
          echo "storage=$STORAGE" >> "$GITHUB_OUTPUT"

      - name: Write job summary
        if: always()
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## Azure Deployment
          - **Resource Group:** `rg-app-prod-01`
          - **Storage Account:** `${{ steps.deploy.outputs.storage || 'n/a' }}`
          - **Status:** ${{ job.status }}
          EOF
