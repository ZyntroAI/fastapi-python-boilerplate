## 7. Required Exporter Notes
For metrics to flow, your `api` and `skip-payment` subcharts must expose metrics:
- **Standard path**: `/metrics` on port `8080` / `8081`
- **Recommended client**: Prometheus client libraries (Python: `prometheus-client`, Node.js: `prom-client`, Go: `github.com/prometheus/client_golang`)
- **Bitnami Postgres**: Already handled — `metrics.enabled: true` in your `values.yaml` deploys the `postgres_exporter` sidecar

### Adjust Before Applying
- ✅ Update `release: prometheus` labels to match your Prometheus Operator release name
- ✅ Ensure Prometheus Operator CRDs exist in your cluster
- ✅ Your API/skip-payment services must expose `/metrics` — if using a different path/port, update the ServiceMonitor `endpoints`
- ✅ Align alert thresholds with your SLOs

