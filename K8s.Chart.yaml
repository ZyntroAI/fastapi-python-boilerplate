## 1. `servicemonitors.yaml` — Prometheus Scraping Config
```yaml
# ==================================================
# servicemonitors.yaml
# ServiceMonitors for payments-platform components
# Requires: Prometheus Operator CRDs installed in cluster
# ==================================================
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payments-api
  namespace: payments
  labels:
    release: prometheus  # Match your Prometheus Operator release label
    app.kubernetes.io/part-of: payments-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  namespaceSelector:
    matchNames:
      - payments
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payments-skip-payment
  namespace: payments
  labels:
    release: prometheus
    app.kubernetes.io/part-of: payments-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: skip-payment
  namespaceSelector:
    matchNames:
      - payments
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: payments-postgres
  namespace: payments
  labels:
    release: prometheus
    app.kubernetes.io/part-of: payments-platform
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - payments
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      scrapeTimeout: 10s
```

> **Note on Postgres**: Your `values.yaml` already enables `metrics.serviceMonitor: true` — Bitnami creates its own ServiceMonitor automatically. Use the above if you prefer a unified manual config, or let Bitnami handle it via the values you already have set.

