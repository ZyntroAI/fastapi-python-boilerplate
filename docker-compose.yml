version: "3.8"

x-common-env: &common-env
  TZ: Asia/Bangkok
  DEFAULT_TZ: Asia/Bangkok

services:
  # ───────────────────────────────────────────
  # 🗄️ Database — PostgreSQL
  # ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: devai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: devops
      POSTGRES_PASSWORD: ${DB_PASSWORD:-DevOpsPass2026}
      POSTGRES_DB: devai_platform
      <<: *common-env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devops -d devai_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devai-network

  # ───────────────────────────────────────────
  # ⚡ Cache / Queue — Redis
  # ───────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: devai-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - devai-network

  # ───────────────────────────────────────────
  # 📦 Object Storage — MinIO (S3-Compatible)
  # ───────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: devai-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-MinioPass2026}
      <<: *common-env
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.minio.rule=Host(`minio.localhost`)"
      - "traefik.http.routers.minio.entrypoints=websecure"
      - "traefik.http.services.minio.loadbalancer.server.port=9001"

  # ───────────────────────────────────────────
  # 🐙 Git Repository — Gitea
  # ───────────────────────────────────────────
  gitea:
    image: gitea/gitea:1.22
    container_name: devai-gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: devai_platform
      GITEA__database__USER: devops
      GITEA__database__PASSWD: ${DB_PASSWORD:-DevOpsPass2026}
      <<: *common-env
    volumes:
      - gitea-data:/var/lib/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.git.rule=Host(`git.localhost`)"
      - "traefik.http.routers.git.entrypoints=websecure"
      - "traefik.http.services.git.loadbalancer.server.port=3000"

  # ───────────────────────────────────────────
  # 🤖 TRAE AI Console — Dashboard & AI Engine
  # ───────────────────────────────────────────
  trae-ai:
    image: nginx:alpine
    container_name: devai-trae-ai
    restart: unless-stopped
    environment:
      <<: *common-env
    volumes:
      - ./trae-ai/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./trae-ai/html:/usr/share/nginx/html:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traeai.rule=Host(`trae-ai.localhost`)"
      - "traefik.http.routers.traeai.entrypoints=websecure"

  # ───────────────────────────────────────────
  # 💳 Stripe Mock — Payment API
  # ───────────────────────────────────────────
  stripe-mock:
    image: stripe/stripe-mock:latest
    container_name: devai-stripe
    restart: unless-stopped
    environment:
      <<: *common-env
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stripe.rule=Host(`stripe.localhost`)"
      - "traefik.http.routers.stripe.entrypoints=websecure"
      - "traefik.http.services.stripe.loadbalancer.server.port=12111"

  # ───────────────────────────────────────────
  # 📊 Monitoring — Prometheus
  # ───────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: devai-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=Host(`prometheus.localhost`)"
      - "traefik.http.routers.prometheus.entrypoints=websecure"

  # ───────────────────────────────────────────
  # 📈 Visualization — Grafana
  # ───────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: devai-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Admin123!}
      <<: *common-env
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.grafana.rule=Host(`grafana.localhost`)"
      - "traefik.http.routers.grafana.entrypoints=websecure"

  # ───────────────────────────────────────────
  # 🔐 Traefik — Reverse Proxy + SSL + Dashboard
  # ───────────────────────────────────────────
  traefik:
    image: traefik:v3.1
    container_name: devai-traefik
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    environment:
      <<: *common-env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/certs:/certs:ro
    networks:
      - devai-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=Host(`traefik.localhost`)"
      - "traefik.http.routers.api.entrypoints=websecure"
      - "traefik.http.routers.api.service=api@internal"
    command:
      - --api=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --api.dashboard=true

# ─────────────────────────────────────────────
# 📦 Volumes
# ─────────────────────────────────────────────
volumes:
  postgres-data:
  redis-data:
  minio-data:
  gitea-data:
  prometheus-data:
  grafana-data:

# ─────────────────────────────────────────────
# 🌐 Network
# ─────────────────────────────────────────────
networks:
  devai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
