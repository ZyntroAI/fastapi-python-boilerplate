## ⚙️ ตัวอย่างคอนฟิกเพิ่มเติม

### `traefik/traefik.yml`
```yaml
http:
  routers:
    trae-ai:
      rule: Host(`trae-ai.localhost`)
      entryPoints: [websecure]
      service: trae-ai
    git:
      rule: Host(`git.localhost`)
      entryPoints: [websecure]
      service: gitea

  services:
    trae-ai:
      loadBalancer:
        servers:
          - url: "http://trae-ai:80"
    gitea:
      loadBalancer:
        servers:
          - url: "http://gitea:3000"
```

ต้องการให้เพิ่ม **Kubernetes Dashboard / Helm**, **GitHub Actions Runner**, หรือ **OIDC SSO** เข้าไปใน compose file นี้ไหมครับ? หรือตัวอย่างไฟล์ `.env` และโครงสร้างโฟลเดอร์ครบชุด?
