<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>FastAPI Search GUI</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>🔎 Search Service</h1>

    <section id="search-section">
        <input type="text" id="query" placeholder="พิมพ์คำค้น…" />
        <input type="number" id="limit" value="10" min="1" max="100" />
        <button id="btn-search">ค้นหา</button>
    </section>

    <section id="results">
        <h2>ผลลัพธ์</h2>
        <pre id="output">—</pre>
    </section>

    <script src="/static/app.js"></script>
</body>
</html>
