## ✅ Permissions Required
Go to your repo → **Settings → Actions → General** → Scroll down to **Workflow permissions**:
- ✅ Set to **"Read and write permissions"** (or ensure your job explicitly has the 3 permissions listed)
- ✅ **Allow GitHub Actions to create and approve pull requests** — not strictly needed here but good practice

---

## 🔐 How It Works (Security)
1. Your **build job runs in an isolated environment** → produces artifacts + hashes
2. The **provenance job runs separately** in a **trusted workflow** from the slsa-framework repo
3. It **signs the attestation** using a **OIDC token from GitHub** → Fulcio certificate binds provenance to your repo identity
4. Signature is **logged to Rekor** (Sigstore transparency log) → anyone can verify it hasn't been tampered
5. Result: **SLSA Build Level 3** compliance — provenance is **non-falsifiable** by the build job

