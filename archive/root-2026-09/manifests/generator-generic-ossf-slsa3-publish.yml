## ⚙️ Customization Points

### 1. Match Your Artifact Path
Change the `files=$(ls dist/*)` line to match **your actual output files**:
```bash
# For npm/frontend
files=$(ls dist/*)

# For binaries
files=$(ls my-project-*.tar.gz)

# For multiple files
files=$(ls bin/*.zip dist/*.tar.gz)
```

### 2. Your Build Commands
Replace the example `npm ci && npm run build` with **your actual build commands** (make, go build, cargo build, etc.).

### 3. Version Tag
The template uses `@v1.4.0` — check for the **latest version** at:
👉 https://github.com/slsa-framework/slsa-github-generator/releases

