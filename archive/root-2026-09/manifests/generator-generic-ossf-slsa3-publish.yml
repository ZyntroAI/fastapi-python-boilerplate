Great — this is the **OpenSSF SLSA Level 3 Generic Provenance Generator Workflow Template**. Here's the complete, ready-to-use file based on the official OpenSSF/SLSA template:

---

## 📄 `.github/workflows/generator-generic-ossf-slsa3-publish.yml`

```yaml
# This workflow generates SLSA Level 3 provenance for release artifacts.
# The generation satisfies level 3 for the provenance requirements - see https://slsa.dev/spec/v0.1/requirements
# This project is an initiative of the OpenSSF (openssf.org) and is developed at
# https://github.com/slsa-framework/slsa-github-generator.
# The provenance file can be verified using the slsa-verifier tool.

name: SLSA Generic Generator
on:
  release:
    types: [created]  # Automatically run when a new Release is created

jobs:
  build:
    outputs:
      digests: ${{ steps.hash.outputs.digests }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ==========================================
      # 👇 YOUR BUILD STEPS HERE 👇
      # ==========================================
      # Example for npm:
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      # ==========================================

      # Step 1: Generate SHA256 hashes of your release artifacts
      - name: Generate subject for provenance
        id: hash
        run: |
          set -euo pipefail

          # List the artifacts the provenance will refer to (adjust pattern as needed)
          files=$(ls dist/*)
          # Generate the subjects (base64 encoded).
          echo "digests=$(sha256sum $files | base64 -w0)" >> "${GITHUB_OUTPUT}"

  provenance:
    needs: [build]
    permissions:
      actions: read   # To read the workflow path
      id-token: write # To sign the provenance (keyless via Sigstore)
      contents: write # To upload provenance to the release
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v1.4.0
    with:
      base64-subjects: "${{ needs.build.outputs.digests }}"
      upload-assets: true  # Attach provenance .intoto.jsonl file to your GitHub Release
```

---

## 🧩 Key Components Explained

| Part | Purpose |
|---|---|
| **`on: release: types: [created]`** | Triggers automatically when you publish a new Release |
| **`build` job** | Your normal build + hash generation step |
| **sha256sum + base64** | Creates a fingerprint of your artifacts for provenance |
| **`provenance` job** | Calls the **trusted reusable workflow** from SLSA framework |
| **`id-token: write`** | Required for **keyless signing** via Sigstore/Fulcio — no PKI needed |
| **`upload-assets: true`** | Attaches `provenance.intoto.jsonl` to your Release assets |
| **SLSA Level 3** | Provenance is **signed by GitHub's OIDC identity**, cannot be forged by the build job — satisfies SLSA Build L3 |

