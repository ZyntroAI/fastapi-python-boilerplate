# deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fastapi-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: fastapi
  template:
    metadata:
      labels:
        app: fastapi
    spec:
      containers:
      - name: app
        image: ZyntroAI/fastapi-python-boilerplate:latest
        ports:
        - containerPort: 8000
        envFrom:
        - secretRef:
            name: app-secrets
